                però en taronja brand sobre fons negre, replicant la sensació del wordmark real.
  font_repo: "web/src/data/business.ts:62-88 + web/src/data/business.ts:91-99 (horari) + web/src/data/business.ts:101-106 (rating) + CLAUDE.md §1 + CONTEXT_ELMININOU.md §1.1-1.6"

# =============================================================================
# 7. RECOMANACIONS ESPECÍFIQUES PER A AQUEST CLIENT
# =============================================================================

recomanacions_per_al_client:
  preu_web_base:
    valor: "1.100 €"
    rao: "Fixat per CLAUDE.md §4 (model econòmic cerrado del projecte). Justificat per: 25 pàgines en build (no 11), carta digital amb 50+ plats, pàgina dedicada al minigolf (NO inclosa en projectes estàndard del cluster), sistema bilingüe CA/ES espejo, Schema.org Restaurant + Service, OG images per idioma. El cluster base és 750 € però aquest projecte té un servei extra (minigolf) i complexitat de carta. Total recomanat amb sessió: 1.300 €."
    font_repo: "CLAUDE.md §4 + CONTEXT_ELMININOU.md §1.7"
  sessio_fotografica_recomanada:
    nivell: "EDITORIAL o COMPLETA"
    rao_per_al_client: |
      Producte altament fotogènic (brasa amb foc viu, plats combinats abundants, tapes per compartir, ambient familiar
      i camp de minigolf al darrere) + DOS escenaris físics dispars (sala de restaurant + camp de minigolf exterior).
      L'estatus actual de la web és que TOTES les imatges (54+) són IA generades amb Gemini, etiquetades honestament
      com 'imatge il·lustrativa generada amb IA' al alt. Per pujar la web a producció amb orgull comercial, cal
      sessió real. CLAUDE.md §4 fixa el preu base en 200 € per 15-20 fotos en 2-3 h, però per a aquest cas amb dos
      escenaris recomano EDITORIAL (4 h, 25-30 fotos) o COMPLETA (mig dia, 35+ fotos) per cobrir bé:
        - 6 plats firma amb foc viu visible
        - 4-5 fotos d'ambient de sala (taula parada, barra, brasa funcionant)
        - 4-5 fotos del minigolf (forats destacats, pal-pilota detall, vista general)
        - 2 retrats del personal o propietari (opcional, depèn de la decisió del client)
    font_repo: "CLAUDE.md §4 + CONTEXT_ELMININOU.md §12.1 punt 2 (cero fotografia real)"
  pla_manteniment_recomanat:
    nivell: "PROFESIONAL"
    rao_per_al_client: |
      La carta del local és canviant (50+ plats amb temporades, possibles variacions setmanals, preus actualitzables),
      el minigolf pot tenir promocions estacionals (Sant Joan al pati, Carnaval familiar, Reis amb minigolf nocturn,
      partides amb llum, paquets aniversari nens), i el client encara no està familiaritzat amb tenir web. Necessita
      mà sostinguda durant el primer any. CLAUDE.md §4 fixa 240 €/any que inclou: dominio, 3 actualitzacions de carta/any,
      2 canvis petits/any, monitorització mensual, suport WhatsApp prioritat 24-48 h. Aquest pla cobreix bé un negoci
      gastronòmic actiu sense ser excessiu.
    font_repo: "CLAUDE.md §4"
  idioma_a4_recomanat:
    valor: "castellà"
    rao: |
      DECISIÓ TÀCTICA — depèn del client, però si haguéssim de triar avui jo recomano CASTELLÀ pels següents motius:
        1. El preview canonical que l'usuari ha referenciat és /es/ (web canonical en castellà del preview).
        2. El públic d'estiueig que ve a L'Ametlla del Vallès des de Barcelona té proporció significativa de
           castellanoparlants (Vallès Oriental amb facilitat d'accés des de C-17).
        3. Les ressenyes són majoritàriament en castellà (5 de 8 ressenyes amb text en castellà, 3 en català).
        4. El propietari pot ser hispanoparlant (pendent de confirmar) i el A4 ha de ser entenedor sense fricció
           lingüística per a una primera reunió comercial freda.
      CONTRA-ARGUMENT: Torrent, Flors i Taronger (els 3 anteriors del cluster local de Francesc) van tenir A4 en
      català. Si vols mantenir coherència de portfolio català, opta per CATALÀ. La web té defaultLang: 'ca' al codi
      (business.ts:67), per tant tècnicament el català és el primer idioma del producte.
      DECISIÓ FINAL: la deixo a Francesc en funció de qui veurà l'A4 primer.
    font_repo: "web/src/data/business.ts:67 (defaultLang) + web/src/data/reviews.ts (proporció CA/ES de ressenyes) + CONTEXT_ELMININOU.md §1.6 (estat comercial)"

