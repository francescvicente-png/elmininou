  accent_secundari:
    nom: "Burnt orange (deeper)"
    oklch: "oklch(42% 0.14 50)"
    hex_aproximat: "#9C4214"
    us_proposat_a4: "elements decoratius, icones line-art de cards, headings accentuats, motius decoratius de cantonada. Fa contrast amb el taronja viu sense saltar a un altre tó."
    font_repo: "web/src/config/theme.ts:60"
  colors_extra:
    backgroundAlt:
      oklch: "oklch(100% 0 0)"
      hex_aproximat: "#FFFFFF"
      us: "card surfaces, blocs alternats sobre el background warm paper"
      font_repo: "web/src/config/theme.ts:50"
    border:
      oklch: "oklch(91% 0.042 58)"
      hex_aproximat: "#F1E2D5"
      us: "marcs subtils de cards, separadors fins"
      font_repo: "web/src/config/theme.ts:54"
    muted:
      oklch: "oklch(48% 0.02 265)"
      hex_aproximat: "#6B7280"
      us: "text secundari, captions, eyebrows"
      font_repo: "web/src/config/theme.ts:53"
    primaryHover:
      oklch: "oklch(60% 0.19 54)"
      hex_aproximat: "#E15F0A"
      us: "estats actius/hover (no rellevant per A4 imprès, però documentat)"
      font_repo: "web/src/config/theme.ts:57"
    rating:
      oklch: "oklch(72% 0.15 74)"
      hex_aproximat: "#D8A53F"
      us: "estrelles daurades de ressenyes Google — IMPORTANT pel A4 perquè el card 'Reseñas Google · 5,0 ★' usa aquest tó d'or, no el taronja viu"
      font_repo: "web/src/config/theme.ts:64"
  observacio_critica: |
    La paleta del repo NO encaixa exactament amb la pista que preveies ("fum/carbó/fusta envellida/cuir/brasa,
    probablement amb tons foscos i un acent càlid"). El que hi ha és:
      - fons CLAR (paper càlid orange blossom) — NO fons fosc
      - tinta NEGRA pura (del logo) — sí coincideix amb la idea de carbó
      - taronja BRASA viu (#FF7518) com a primary — sí coincideix amb foc viu
      - burnt orange (#9C4214) com a accent — sí coincideix amb fusta envellida / cuir vell
    El mood resultant és més 'taverna catalana lluminosa amb foc viu' que 'restaurant fosc tipus steakhouse americà'.
    Per al A4: això vol dir que el fons del cartell ha de ser CLAR (paper càlid), amb header bar fosc, i la calidesa
    ve de la quantitat de taronja vivido + burnt orange + dauradet de les estrelles. NO ha de ser un cartell fosc.

