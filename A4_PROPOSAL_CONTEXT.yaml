# =============================================================================
# 10. DADES EXTRA QUE PODEN MILLORAR LA PROPOSTA
# =============================================================================

dades_extra_rellevants:
  - frase_canonica_marca_web: |
      Hero canonical de la home (web/src/components/restaurant/RestaurantHomePage.astro:36-37):
        - CA: 'Brases, menú del dia i tapes sense complicacions'
        - ES: 'Brasa, menú del día y tapas sin complicaciones'
      Subtítol del hero (línia 43):
        - CA: 'Foc viu i producte treballat'
        - ES: 'Fuego vivo y producto trabajado'
      Aquesta frase 'Brases, menú del dia i tapes sense complicacions' és el equivalent canònic
      del 'Som El Taronger: fruita fresca' del Taronger. Convé incloure-la al A4 com a tagline
      del header bar o al peu del logo, perquè és literal de la web i resumeix l'oferta.
  - minigolf_prominencia_web: |
      El minigolf NO és només una pàgina dedicada — apareix també a la home com a SECCIÓ pròpia
      ('MinigolfSection.astro' renderitzada entre el banner CTA i la ubicació). El client veu
      la seva diferenciació destacada de seguida en obrir la portada. Per al A4: això reforça
      que el minigolf té d'aparèixer com a feature independent (id 1 a la llista de 8 features),
      no com a subnota del restaurant.
  - promesa_gratis_si_menges: |
      La promesa 'GRATIS si dines aquí · 5 € si només jugues' apareix renderitzada AMB DESTAQUE
      VISUAL (label en majúscules taronges, número en gran, context en text muted) tant a
      MinigolfSection com a la pàgina /minigolf/. Font: web/src/components/sections/MinigolfSection.astro:29-32.
      És un CTA gratificant que fa de gancho comercial intern. Al A4 hauria de tenir presència explícita
      (potser dins la card 'Pàgina dedicada al minigolf' o com a callout independent).
  - logo_composicio_distintiva: |
      El logo és REALMENT distintiu: combina pilota de golf gegant (cercle taronja amb dimples sobre fons negre)
      + wordmark sans-serif rodó + pilota de golf 3D damunt tee substituint la 'o' final + tagline 'BRASA I +'
      en cursiva script. Aquesta composició és gairebé impossible de confondre amb cap altre restaurant. Si Gemini
      pot incorporar la imatge real al header bar, fes-ho. Si no, com a mínim usa la frase 'BRASA I +' com a
      tagline subtil sota el títol del A4 — és literal del logo i el client la reconeixerà a l'instant.
  - patro_de_resenyes_publiques: |
      Patró fort detectat a les 8 ressenyes amb text (web/src/data/reviews.ts):
        - 'amics' / 'grup gran': mencionat 3 vegades (Olga, Pol, Jamil)
        - 'nens' / 'menuts' / 'família': mencionat 4 vegades (Olga, Nuria, Jamil, perfil general)
        - 'minigolf' / 'mini golf' / 'camp de mini golf' / '18 forats': mencionat explícitament 5 de 8 vegades
        - 'brasa' / 'carn espectacular' / 'xurrasco' / 'xai' / 'entranya' / 'costella': mencionat 5 vegades
        - 'descobriment' / 'gran descobriment' / 'amagat': mencionat 3 vegades (sensació de 'troballa secreta')
        - 'ambient familiar' / 'distès' / 'distendido': mencionat 4 vegades
        - 'preu raonable' / 'bons preus': mencionat 3 vegades
      CONCLUSIÓ: el client ja té validat pel mercat que els seus 3 angles forts són MINIGOLF, BRASA i FAMILIAR.
      El A4 hauria de jerarquitzar amb aquests 3 angles, en aquest ordre.
      Pull quote suggerit per al A4 (si Francesc vol incloure'n una): 'Tot i estar amagat, el menjar genial i un
      gran descobriment en tots els sentits' — Santi Izquierdo, Març 2026 (web/src/data/reviews.ts:122-125).
  - components_unics_d_aquest_projecte: |
      Components que NO existien al cluster anterior i s'han creat específicament per a El mini nou:
        - MinigolfSection.astro (home + página dedicada)
        - MinigolfHoles.astro (presentació dels 18 forats individualment amb difficulty 1-3)
        - ReviewsBentoSection.astro (bento editorial de ressenyes reals — primera implementació real,
          els altres clients del cluster tenien blocs simples sense ressenyes verbatim)
        - MenuSignatureDishes.astro (3 plats firma destacats al començament de la carta)
        - MenuDietaryFilter.astro (filtres dietètics combinables amb 5 etiquetes)
      Això reforça que el preu base de 1.100 € no és arbitrari: hi ha 3-4 components NOVES de codi
      escrits específicament per aquest client, no només un re-skinnig de plantilla.

